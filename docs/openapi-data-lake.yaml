  /v1/polygons/tiles/{dataset}/{z}/{x}/{y}:
    get:
      summary: Get polygons as a tile FeatureCollection for a Web Mercator tile
      description: >
        Returns a GeoJSON FeatureCollection for the requested tile by intersecting the tile bbox with the curated polygons.
        Polygons are loaded from local curated GeoJSON if present; if missing and REMOTE_BASE_URL is set, they are fetched over HTTP.
        If polygons are not available locally or remotely, the endpoint returns 200 with an empty FeatureCollection and caching headers.
      parameters:
        - in: path
          name: dataset
          required: true
          schema: { type: string, enum: [flood_zones, rse] }
        - in: path
          name: z
          required: true
          schema: { type: integer, minimum: 0, maximum: 22 }
        - in: path
          name: x
          required: true
          schema: { type: integer, minimum: 0 }
        - in: path
          name: y
          required: true
          schema: { type: integer, minimum: 0 }
        - in: query
          name: region
          schema: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
          required: true
        - in: query
          name: scenario
          schema:
            type: string
            enum: [defended_1in100_1in200, undefended_1in100_1in200, defended_1in1000, undefended_1in1000]
          description: Required for rse dataset
        - in: query
          name: format
          schema: { type: string, enum: [simplified, normalized], default: simplified }
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Weak ETag for response body
              schema: { type: string }
            Cache-Control:
              description: HTTP cache policy with TTL
              schema: { type: string }
            X-RateLimit-Limit:
              description: Requests allowed per window
              schema: { type: integer }
            X-RateLimit-Remaining:
              description: Requests remaining in current window
              schema: { type: integer }
            X-RateLimit-Reset:
              description: Seconds until window resets
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: object
                description: GeoJSON FeatureCollection
              examples:
                flood_zones_simplified:
                  summary: Flood Zones (simplified)
                  value:
                    type: "FeatureCollection"
                    features:
                      - type: "Feature"
                        properties: { id: "fz-1" }
                        geometry:
                          type: "Polygon"
                          coordinates:
                            - - [ -2.70, 51.10 ]
                              - [ -2.69, 51.11 ]
                              - [ -2.68, 51.10 ]
                              - [ -2.70, 51.10 ]
                rse_defended_1in100_1in200:
                  summary: RSE defended 1-in-100/200 (simplified)
                  value:
                    type: "FeatureCollection"
                    features:
                      - type: "Feature"
                        properties: { id: "rse-def-100-200-1" }
                        geometry:
                          type: "Polygon"
                          coordinates:
                            - - [ -3.00, 51.20 ]
                              - [ -2.99, 51.21 ]
                              - [ -2.98, 51.20 ]
                              - [ -3.00, 51.20 ]
                flood_zones_normalized:
                  summary: Flood Zones (normalized)
                  value:
                    type: "FeatureCollection"
                    features:
                      - type: "Feature"
                        properties: { id: "fz-norm-1", area_m2: 12345 }
