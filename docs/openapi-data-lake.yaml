openapi: 3.0.3
info:
  title: Flood Watch Data Lake API
  version: 0.1.0
  description: Data Lake endpoints for hydrology, rainfall, warnings, forecasts, and backfill jobs.
servers:
  - url: http://localhost:8000
    description: Local dev
  - url: https://lake.example.com
    description: Production
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Station:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        river_name: { type: string }
        provider: { type: string }
    SeriesPoint:
      type: object
      properties:
        t: { type: string, format: date-time }
        value: { type: number }
        agg: { type: string, enum: [raw, hour, day] }
        quality: { type: string }
    MeasurementsResponse:
      type: object
      properties:
        station: { $ref: '#/components/schemas/Station' }
        series:
          type: array
          items: { $ref: '#/components/schemas/SeriesPoint' }
        window:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        provenance:
          type: object
          properties:
            as_of: { type: string, format: date-time }
            source: { type: string }
    RainfallDaily:
      type: object
      properties:
        date: { type: string, format: date }
        prcp_mm: { type: number }
    RainfallResponse:
      type: object
      properties:
        region_id: { type: string }
        cell_id: { type: string }
        series:
          type: array
          items: { $ref: '#/components/schemas/RainfallDaily' }
        provenance:
          type: object
          properties:
            dataset: { type: string }
            version: { type: string }
            as_of: { type: string, format: date-time }
    Warning:
      type: object
      properties:
        id: { type: string }
        severity:
          type: string
          enum:
            - Severe Flood Warning
            - Flood Warning
            - Flood Alert
            - No Longer In Force
        title: { type: string }
        issued_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        geometry: { type: object }
        source: { type: string }
    WarningList:
      type: array
      items: { $ref: '#/components/schemas/Warning' }
    PredictionImpactWindow:
      type: object
      nullable: true
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    PredictionSummary:
      type: object
      properties:
        verdict: { type: string, enum: [clear, watch, at_risk, likely_impassable] }
        verdictLabel: { type: string }
        timeToImpactHours: { type: number, nullable: true }
        impactWindow: { $ref: '#/components/schemas/PredictionImpactWindow' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        confidenceLabel: { type: string, enum: [Low, Medium, High] }
        summary: { type: string }
    PredictionDriver:
      type: object
      description: >
        Stable v1 driver row. Shape varies by type; consumers should branch on `type`.
        Current v1 types are `gauge_trajectory`, `historic_analogue`, and `analogue_consensus`.
      properties:
        type: { type: string, enum: [gauge_trajectory, historic_analogue, analogue_consensus] }
        ref: { type: string }
        label: { type: string }
        signal: { type: string }
        level: { type: number, nullable: true }
        pct_rank: { type: number, nullable: true }
        slope_per_hour: { type: number, nullable: true }
        similarity: { type: number, nullable: true }
        outcome: { type: string, enum: [impact, watch, clear], nullable: true }
        timeToImpactHours: { type: number, nullable: true }
        impactRate: { type: number, nullable: true }
        watchRate: { type: number, nullable: true }
    PredictionAffectedArea:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        kind: { type: string }
        risk: { type: string, enum: [low, medium, high] }
    PredictionDispatch:
      type: object
      properties:
        implication: { type: string }
        safeToPass: { type: boolean }
    PredictionMethod:
      type: object
      properties:
        name: { type: string, enum: [historic_analogue_v1] }
        inputs:
          type: array
          items: { type: string }
        parameters:
          type: object
          properties:
            windowHours: { type: integer }
            historyDays: { type: integer }
            topK: { type: integer }
            minSimilarity: { type: number }
        notes: { type: string }
    PredictionPrimaryAnalysis:
      type: object
      properties:
        level: { type: number, nullable: true }
        slope_per_hour: { type: number, nullable: true }
        pct_rank: { type: number, nullable: true }
        p70: { type: number, nullable: true }
        p90: { type: number, nullable: true }
        p95: { type: number, nullable: true }
        signal: { type: string }
        hours_to_p95: { type: number, nullable: true }
        as_of_point: { type: string, format: date-time, nullable: true }
    PredictionObservables:
      type: object
      properties:
        seriesStart: { type: string, format: date-time, nullable: true }
        keyGaugeId: { type: string }
        rainfallUpstreamMm:
          type: array
          items: { type: number }
        gaugeSeries:
          type: object
          additionalProperties:
            type: array
            items: { type: number }
        primaryMeasureId: { type: string }
        primaryAnalysis: { $ref: '#/components/schemas/PredictionPrimaryAnalysis' }
    CorridorPredictionResponse:
      type: object
      properties:
        schema: { type: string, enum: [floodwatch.prediction.v1] }
        as_of: { type: string, format: date-time }
        region: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
        corridor:
          type: object
          properties:
            id: { type: string }
            label: { type: string }
        prediction: { $ref: '#/components/schemas/PredictionSummary' }
        drivers:
          type: array
          items: { $ref: '#/components/schemas/PredictionDriver' }
        affectedAreas:
          type: array
          items: { $ref: '#/components/schemas/PredictionAffectedArea' }
        dispatch: { $ref: '#/components/schemas/PredictionDispatch' }
        method: { $ref: '#/components/schemas/PredictionMethod' }
        observables: { $ref: '#/components/schemas/PredictionObservables' }
    PredictionCorridor:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        region: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
    PredictionCorridorListResponse:
      type: object
      properties:
        corridors:
          type: array
          items: { $ref: '#/components/schemas/PredictionCorridor' }
    RetrieveContextResponse:
      type: object
      properties:
        signals:
          type: object
        snippets:
          type: array
          items:
            type: object
            properties:
              source: { type: string }
              text: { type: string }
              score: { type: number }
        window:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
    ForecastDay:
      type: object
      properties:
        date: { type: string, format: date }
        summary: { type: string }
        prcp_mm: { type: number }
        wind_kph: { type: number }
    ForecastResponse:
      type: object
      properties:
        region_id: { type: string }
        days:
          type: array
          items: { $ref: '#/components/schemas/ForecastDay' }
        provenance:
          type: object
          properties:
            source: { type: string }
            as_of: { type: string, format: date-time }
    BackfillRequest:
      type: object
      required: [dataset, from, to]
      properties:
        dataset:
          type: string
          enum: [hydrology_readings, haduk_grid_daily, era5_land_hourly, nrfa_daily, incidents]
        region_id:
          type: string
          description: Optional region scope (BRI,SOM,DOR,DEV,CON)
        series_id:
          type: string
          description: Optional series id for per-measure runs
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        slice_size:
          type: string
          enum: [hour, day, month]
    BackfillAccepted:
      type: object
      properties:
        job_id: { type: string }
        status_url: { type: string }
paths:
  /v1/measurements:
    get:
      summary: Get measurements for a station or measure
      description: >
        Returns hydrology measurements for a station or measure with optional aggregation (raw/hour/day) and pagination.
        Data is read from local gz NDJSON files when present or fetched over HTTP when REMOTE_BASE_URL is set.
        When no data is available locally or remotely, the endpoint returns 200 with an empty series and appropriate caching headers.
        When bbox is provided, the station is resolved via discovery data and an empty series is returned if the station is outside the bbox.
      parameters:
        - in: query
          name: station_id
          schema: { type: string }
        - in: query
          name: measure_id
          schema: { type: string }
        - in: query
          name: region
          schema: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
        - in: query
          name: bbox
          schema: { type: string }
          description: west,south,east,north. When provided, station is resolved via discovery data; returns empty series if station lies outside bbox. Station lat/lng/name may be populated.
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: aggregate
          schema: { type: string, enum: [raw, hour, day], default: raw }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Weak ETag for response body
              schema: { type: string }
            Cache-Control:
              description: HTTP cache policy with TTL
              schema: { type: string }
            X-RateLimit-Limit:
              description: Requests allowed per window
              schema: { type: integer }
            X-RateLimit-Remaining:
              description: Requests remaining in current window
              schema: { type: integer }
            X-RateLimit-Reset:
              description: Seconds until window resets
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementsResponse' }
              examples:
                raw:
                  summary: Raw observations
                  value:
                    station: { id: "ST01", name: "River Avon Station", lat: 51.45, lng: -2.59 }
                    series:
                      - { t: "2026-03-10T00:00:00Z", value: 1.21, agg: "raw" }
                      - { t: "2026-03-10T00:15:00Z", value: 1.24, agg: "raw" }
                      - { t: "2026-03-10T00:30:00Z", value: 1.26, agg: "raw" }
                    window:
                      from: "2026-03-10T00:00:00Z"
                      to: "2026-03-10T01:00:00Z"
                    provenance:
                      as_of: "2026-03-10T01:00:00Z"
                      source: "lake"
                hour:
                  summary: Hourly aggregates
                  value:
                    station: { id: "ST01", name: "River Avon Station", lat: 51.45, lng: -2.59 }
                    series:
                      - { t: "2026-03-10T00:00:00Z", value: 1.24, agg: "hour" }
                      - { t: "2026-03-10T01:00:00Z", value: 1.31, agg: "hour" }
                    window:
                      from: "2026-03-10T00:00:00Z"
                      to: "2026-03-10T02:00:00Z"
                    provenance:
                      as_of: "2026-03-10T02:00:00Z"
                      source: "lake"
  /v1/rainfall:
    get:
      summary: Get rainfall daily series for a region or cell
      parameters:
        - in: query
          name: region
          schema: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
        - in: query
          name: cell_id
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RainfallResponse' }
  /v1/warnings:
    get:
      summary: Get flood warnings (normalized from EA)
      description: Returns active warnings (min severity Flood Alert and above) normalized to a stable schema. Scoped by region via near centers; optionally filter by bbox.
      parameters:
        - in: query
          name: bbox
          schema: { type: string }
        - in: query
          name: region
          schema: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
        - in: query
          name: county
          schema: { type: string }
          description: Optional county filter passed through to EA floods endpoint
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: min_severity
          schema: { type: integer, enum: [1,2,3,4], default: 3 }
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Weak ETag for response body
              schema: { type: string }
            Cache-Control:
              description: HTTP cache policy with TTL
              schema: { type: string }
            X-RateLimit-Limit:
              description: Requests allowed per window
              schema: { type: integer }
            X-RateLimit-Remaining:
              description: Requests remaining in current window
              schema: { type: integer }
            X-RateLimit-Reset:
              description: Seconds until window resets
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    $ref: '#/components/schemas/WarningList'
              examples:
                region:
                  summary: Region scoped warnings (near centers)
                  value:
                    items:
                      - id: "flood-123"
                        severity: "Flood Warning"
                        title: "Flooding expected in low lying areas near river"
                        issued_at: "2026-03-10T08:00:00Z"
                        updated_at: "2026-03-10T09:00:00Z"
                        geometry:
                          type: "Polygon"
                          coordinates:
                            - - [ -2.60, 51.45 ]
                              - [ -2.59, 51.46 ]
                              - [ -2.58, 51.45 ]
                              - [ -2.60, 51.45 ]
                        source: "ea:flood-monitoring"
                bbox:
                  summary: Filter by bounding box
                  value:
                    items:
                      - id: "flood-234"
                        severity: "Flood Alert"
                        title: "Low lying areas in bbox"
                        issued_at: "2026-03-10T10:00:00Z"
                        updated_at: "2026-03-10T11:00:00Z"
                        geometry:
                          type: "Polygon"
                          coordinates:
                            - - [ -2.70, 51.40 ]
                              - [ -2.69, 51.41 ]
                              - [ -2.68, 51.40 ]
                              - [ -2.70, 51.40 ]
                        source: "ea:flood-monitoring"
                county:
                  summary: Filter by county
                  value:
                    items:
                      - id: "flood-345"
                        severity: "Flood Warning"
                        title: "County level warning"
                        issued_at: "2026-03-11T06:00:00Z"
                        updated_at: "2026-03-11T07:00:00Z"
                        geometry:
                          type: "Polygon"
                          coordinates:
                            - - [ -3.00, 51.10 ]
                              - [ -2.99, 51.11 ]
                              - [ -2.98, 51.10 ]
                              - [ -3.00, 51.10 ]
                        source: "ea:flood-monitoring"
  /v1/predictions:
    get:
      summary: Get corridor prediction from historic EA analogue matching
      description: >
        Returns the current `floodwatch.prediction.v1` document for a configured corridor.
        v1 uses a multi-gauge historic analogue matcher over mined EA stage history and emits
        `historic_analogue` drivers, consensus rates, and a dispatch implication.
      parameters:
        - in: query
          name: corridor
          required: true
          schema: { type: string, example: a361-muchelney }
          description: Corridor id from `/v1/predictions/corridors`
        - in: query
          name: history_days
          schema: { type: integer, minimum: 7, maximum: 400, default: 120 }
          description: Lookback window for loading mined history
        - in: query
          name: as_of
          schema: { type: string, format: date-time, example: "2020-02-16T12:00:00Z" }
          description: Optional UTC evaluation instant for storm replay / hindcast
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CorridorPredictionResponse' }
              examples:
                analogue_match:
                  summary: Rising corridor with matched analogues
                  value:
                    schema: "floodwatch.prediction.v1"
                    as_of: "2026-09-03T12:00:00Z"
                    region: "SOM"
                    corridor: { id: "a361-muchelney", label: "A361 Muchelney corridor" }
                    prediction:
                      verdict: "at_risk"
                      verdictLabel: "At risk within window"
                      timeToImpactHours: 6
                      impactWindow:
                        from: "2026-09-03T16:00:00Z"
                        to: "2026-09-03T21:00:00Z"
                      confidence: 0.78
                      confidenceLabel: "High"
                      summary: "Historic EA matches indicate likely corridor disruption within the next day."
                    drivers:
                      - type: "gauge_trajectory"
                        ref: "52119-level-stage-i-15_min-mASD"
                        label: "Gaw Bridge · River Parrett"
                        signal: "rising_toward_high"
                        level: 2.24
                        pct_rank: 91.2
                        slope_per_hour: 0.018
                      - type: "historic_analogue"
                        ref: "2020-02-16T00:00:00Z"
                        label: "Feb 2020 analogue"
                        similarity: 0.91
                        outcome: "impact"
                        timeToImpactHours: 8
                      - type: "analogue_consensus"
                        ref: "k12"
                        label: "12 matched windows"
                        impactRate: 0.75
                        watchRate: 0.08
                    affectedAreas:
                      - id: "area-muchelney-lanes"
                        label: "Muchelney low lanes"
                        kind: "road_segment"
                        risk: "high"
                    dispatch:
                      implication: "Hold non-urgent runs on A361 Muchelney corridor within ~6h if levels keep rising."
                      safeToPass: false
                    method:
                      name: "historic_analogue_v1"
                      inputs: ["ea_stage_history_hour", "corridor_gauge_set"]
                      parameters:
                        windowHours: 24
                        historyDays: 120
                        topK: 20
                        minSimilarity: 0.85
                      notes: "Matches current multi-gauge shape to past EA windows. Not a rainfall-lag or depth model; confidence reflects analogue agreement."
                    observables:
                      seriesStart: "2026-09-03T01:00:00Z"
                      keyGaugeId: "gauge-gaw-bridge"
                      rainfallUpstreamMm: []
                      gaugeSeries:
                        gauge-gaw-bridge: [1.82, 1.86, 1.9, 1.94, 2.0, 2.05, 2.1, 2.14, 2.17, 2.2, 2.22, 2.24]
                      primaryMeasureId: "52119-level-stage-i-15_min-mASD"
                      primaryAnalysis:
                        level: 2.24
                        slope_per_hour: 0.018
                        pct_rank: 91.2
                        p70: 1.61
                        p90: 2.03
                        p95: 2.18
                        signal: "rising_toward_high"
                        hours_to_p95: null
                        as_of_point: "2026-09-03T12:00:00Z"
        '404':
          description: Unknown corridor id
        '500':
          description: Prediction generation failed
  /v1/storms:
    get:
      summary: List curated storms for place-mode replay
      parameters:
        - in: query
          name: corridor
          schema: { type: string, example: a361-muchelney }
          description: Optional corridor filter
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  storms:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        label: { type: string }
                        corridor: { type: string }
                        as_of: { type: string, format: date-time }
                        expected_verdict: { type: string }
                        notes: { type: string }
        '404':
          description: Unknown corridor id
  /v1/storms/{storm_id}:
    get:
      summary: Get one curated storm
      parameters:
        - in: path
          name: storm_id
          required: true
          schema: { type: string, example: eval-2020-02 }
      responses:
        '200':
          description: OK
        '404':
          description: Unknown storm id
  /v1/predictions/corridors:
    get:
      summary: List supported prediction corridors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PredictionCorridorListResponse' }
              examples:
                default:
                  value:
                    corridors:
                      - id: "a361-muchelney"
                        label: "A361 Muchelney corridor"
                        region: "SOM"
  /v1/retrieve-context:
    get:
      summary: Retrieve signals and snippets for RAG
      parameters:
        - in: query
          name: region
          schema: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
        - in: query
          name: route
          schema: { type: string }
        - in: query
          name: time_window
          schema: { type: string }
        - in: query
          name: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetrieveContextResponse' }
  /v1/forecast:
    get:
      summary: Get 5‑day forecast for a region
      parameters:
        - in: query
          name: region
          schema: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForecastResponse' }
  /v1/jobs/backfill:
    post:
      summary: Start a backfill job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackfillRequest' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackfillAccepted' }
  /v1/polygons:
    get:
      summary: Get curated polygons metadata or inline FeatureCollection
      description: >
        Returns curated polygons metadata by default. When inline=true and a small bbox is supplied, returns a GeoJSON FeatureCollection.
        Polygons are loaded from local curated GeoJSON if present; if missing and REMOTE_BASE_URL is set, they are fetched over HTTP.
        If polygons are not available locally or remotely, the endpoint returns 200 with an empty FeatureCollection and caching headers.
      parameters:
        - in: query
          name: dataset
          schema: { type: string, enum: [flood_zones, rse] }
        - in: query
          name: region
          schema: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
        - in: query
          name: scenario
          schema:
            type: string
            enum: [defended_1in100_1in200, undefended_1in100_1in200, defended_1in1000, undefended_1in1000]
          description: Required for rse dataset
        - in: query
          name: format
          schema: { type: string, enum: [simplified, normalized], default: simplified }
        - in: query
          name: inline
          schema: { type: boolean, default: false }
          description: If true, returns FeatureCollection for small bbox
        - in: query
          name: bbox
          schema: { type: string }
          description: Required when inline=true; west,south,east,north
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Weak ETag for response body
              schema: { type: string }
            Cache-Control:
              description: HTTP cache policy with TTL
              schema: { type: string }
            X-RateLimit-Limit:
              description: Requests allowed per window
              schema: { type: integer }
            X-RateLimit-Remaining:
              description: Requests remaining in current window
              schema: { type: integer }
            X-RateLimit-Reset:
              description: Seconds until window resets
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: object
                properties:
                  region_id: { type: string }
                  dataset: { type: string }
                  scenario: { type: string }
                  format: { type: string }
                  path: { type: string }
                  count: { type: integer }
                  data:
                    type: object
                    description: Optional GeoJSON FeatureCollection when inline=true
              examples:
                metadata:
                  summary: Metadata only (no inline)
                  value:
                    region_id: "SOM"
                    dataset: "flood_zones"
                    format: "simplified"
