openapi: 3.0.3
info:
  title: Flood Watch Data Lake API
  version: 0.1.0
  description: Data Lake endpoints for hydrology, rainfall, warnings, forecasts, and backfill jobs.
servers:
  - url: http://localhost:8000
    description: Local dev
  - url: https://lake.example.com
    description: Production
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Station:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        river_name: { type: string }
        provider: { type: string }
    SeriesPoint:
      type: object
      properties:
        t: { type: string, format: date-time }
        value: { type: number }
        agg: { type: string, enum: [raw, hour, day] }
        quality: { type: string }
    MeasurementsResponse:
      type: object
      properties:
        station: { $ref: '#/components/schemas/Station' }
        series:
          type: array
          items: { $ref: '#/components/schemas/SeriesPoint' }
        window:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        provenance:
          type: object
          properties:
            as_of: { type: string, format: date-time }
            source: { type: string }
    RainfallDaily:
      type: object
      properties:
        date: { type: string, format: date }
        prcp_mm: { type: number }
    RainfallResponse:
      type: object
      properties:
        region_id: { type: string }
        cell_id: { type: string }
        series:
          type: array
          items: { $ref: '#/components/schemas/RainfallDaily' }
        provenance:
          type: object
          properties:
            dataset: { type: string }
            version: { type: string }
            as_of: { type: string, format: date-time }
    Warning:
      type: object
      properties:
        id: { type: string }
        severity:
          type: string
          enum:
            - Severe Flood Warning
            - Flood Warning
            - Flood Alert
            - No Longer In Force
        title: { type: string }
        issued_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        geometry: { type: object }
        source: { type: string }
    WarningList:
      type: array
      items: { $ref: '#/components/schemas/Warning' }
    RetrieveContextResponse:
      type: object
      properties:
        signals:
          type: object
        snippets:
          type: array
          items:
            type: object
            properties:
              source: { type: string }
              text: { type: string }
              score: { type: number }
        window:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
    ForecastDay:
      type: object
      properties:
        date: { type: string, format: date }
        summary: { type: string }
        prcp_mm: { type: number }
        wind_kph: { type: number }
    ForecastResponse:
      type: object
      properties:
        region_id: { type: string }
        days:
          type: array
          items: { $ref: '#/components/schemas/ForecastDay' }
        provenance:
          type: object
          properties:
            source: { type: string }
            as_of: { type: string, format: date-time }
    BackfillRequest:
      type: object
      required: [dataset, from, to]
      properties:
        dataset:
          type: string
          enum: [hydrology_readings, haduk_grid_daily, era5_land_hourly, nrfa_daily, incidents]
        region_id:
          type: string
          description: Optional region scope (BRI,SOM,DOR,DEV,CON)
        series_id:
          type: string
          description: Optional series id for per-measure runs
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        slice_size:
          type: string
          enum: [hour, day, month]
    BackfillAccepted:
      type: object
      properties:
        job_id: { type: string }
        status_url: { type: string }
paths:
  /v1/measurements:
    get:
      summary: Get measurements for a station or measure
      parameters:
        - in: query
          name: station_id
          schema: { type: string }
        - in: query
          name: measure_id
          schema: { type: string }
        - in: query
          name: region
          schema: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
        - in: query
          name: bbox
          schema: { type: string }
          description: west,south,east,north
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: aggregate
          schema: { type: string, enum: [raw, hour, day], default: raw }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementsResponse' }
              examples:
                raw:
                  summary: Raw observations
                  value:
                    station: { id: "ST01", name: "River Avon Station" }
                    series:
                      - { t: "2026-03-10T00:00:00Z", value: 1.21, agg: "raw" }
                      - { t: "2026-03-10T00:15:00Z", value: 1.24, agg: "raw" }
                      - { t: "2026-03-10T00:30:00Z", value: 1.26, agg: "raw" }
                    window:
                      from: "2026-03-10T00:00:00Z"
                      to: "2026-03-10T01:00:00Z"
                    provenance:
                      as_of: "2026-03-10T01:00:00Z"
                      source: "lake"
                hour:
                  summary: Hourly aggregates
                  value:
                    station: { id: "ST01", name: "River Avon Station" }
                    series:
                      - { t: "2026-03-10T00:00:00Z", value: 1.24, agg: "hour" }
                      - { t: "2026-03-10T01:00:00Z", value: 1.31, agg: "hour" }
                    window:
                      from: "2026-03-10T00:00:00Z"
                      to: "2026-03-10T02:00:00Z"
                    provenance:
                      as_of: "2026-03-10T02:00:00Z"
                      source: "lake"
  /v1/rainfall:
    get:
      summary: Get rainfall daily series for a region or cell
      parameters:
        - in: query
          name: region
          schema: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
        - in: query
          name: cell_id
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RainfallResponse' }
  /v1/warnings:
    get:
      summary: Get flood warnings (normalized from EA)
      description: Returns active warnings (min severity Flood Alert and above) normalized to a stable schema. Scoped by region via near centers; optionally filter by bbox.
      parameters:
        - in: query
          name: bbox
          schema: { type: string }
        - in: query
          name: region
          schema: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
        - in: query
          name: since
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    $ref: '#/components/schemas/WarningList'
              example:
                items:
                  - id: "flood-123"
                    severity: "Flood Warning"
                    title: "Flooding expected in low lying areas near river"
                    issued_at: "2026-03-10T08:00:00Z"
                    updated_at: "2026-03-10T09:00:00Z"
                    geometry:
                      type: "Polygon"
                      coordinates:
                        - - [ -2.60, 51.45 ]
                          - [ -2.59, 51.46 ]
                          - [ -2.58, 51.45 ]
                          - [ -2.60, 51.45 ]
                    source: "ea:flood-monitoring"
  /v1/retrieve-context:
    get:
      summary: Retrieve signals and snippets for RAG
      parameters:
        - in: query
          name: region
          schema: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
        - in: query
          name: route
          schema: { type: string }
        - in: query
          name: time_window
          schema: { type: string }
        - in: query
          name: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetrieveContextResponse' }
  /v1/forecast:
    get:
      summary: Get 5‑day forecast for a region
      parameters:
        - in: query
          name: region
          schema: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForecastResponse' }
  /v1/jobs/backfill:
    post:
      summary: Start a backfill job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackfillRequest' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackfillAccepted' }
  /v1/polygons:
    get:
      summary: Get curated polygons metadata or inline FeatureCollection
      parameters:
        - in: query
          name: dataset
          schema: { type: string, enum: [flood_zones, rse] }
        - in: query
          name: region
          schema: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
        - in: query
          name: scenario
          schema:
            type: string
            enum: [defended_1in100_1in200, undefended_1in100_1in200, defended_1in1000, undefended_1in1000]
          description: Required for rse dataset
        - in: query
          name: format
          schema: { type: string, enum: [simplified, normalized], default: simplified }
        - in: query
          name: inline
          schema: { type: boolean, default: false }
          description: If true, returns FeatureCollection for small bbox
        - in: query
          name: bbox
          schema: { type: string }
          description: Required when inline=true; west,south,east,north
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  region_id: { type: string }
                  dataset: { type: string }
                  scenario: { type: string }
                  format: { type: string }
                  path: { type: string }
                  count: { type: integer }
                  data:
                    type: object
                    description: Optional GeoJSON FeatureCollection when inline=true
              examples:
                metadata:
                  summary: Metadata only (no inline)
                  value:
                    region_id: "SOM"
                    dataset: "flood_zones"
                    format: "simplified"
                    path: "data/curated/ea/flood_zones/SOM_fz2_3_simplified.geojson"
                    count: 12450
                inline:
                  summary: Inline FeatureCollection
                  value:
                    region_id: "SOM"
                    dataset: "flood_zones"
                    format: "simplified"
                    path: "data/curated/ea/flood_zones/SOM_fz2_3_simplified.geojson"
                    count: 3
                    data:
                      type: "FeatureCollection"
                      features:
                        - type: "Feature"
                          properties: { id: "fz-1" }
                          geometry:
                            type: "Polygon"
                            coordinates:
                              - - [ -2.70, 51.10 ]
                                - [ -2.69, 51.11 ]
                                - [ -2.68, 51.10 ]
                                - [ -2.70, 51.10 ]
  /v1/polygons/tiles/{dataset}/{z}/{x}/{y}:
    get:
      summary: Get polygons as a tile FeatureCollection for a Web Mercator tile
      parameters:
        - in: path
          name: dataset
          required: true
          schema: { type: string, enum: [flood_zones, rse] }
        - in: path
          name: z
          required: true
          schema: { type: integer, minimum: 0, maximum: 22 }
        - in: path
          name: x
          required: true
          schema: { type: integer, minimum: 0 }
        - in: path
          name: y
          required: true
          schema: { type: integer, minimum: 0 }
        - in: query
          name: region
          schema: { type: string, enum: [BRI, SOM, DOR, DEV, CON] }
          required: true
        - in: query
          name: scenario
          schema:
            type: string
            enum: [defended_1in100_1in200, undefended_1in100_1in200, defended_1in1000, undefended_1in1000]
          description: Required for rse dataset
        - in: query
          name: format
          schema: { type: string, enum: [simplified, normalized], default: simplified }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: GeoJSON FeatureCollection
              example:
                type: "FeatureCollection"
                features:
                  - type: "Feature"
                    properties: { id: "tile-fz-1" }
                    geometry:
                      type: "Polygon"
                      coordinates:
                        - - [ -2.70, 51.10 ]
                          - [ -2.69, 51.11 ]
                          - [ -2.68, 51.10 ]
                          - [ -2.70, 51.10 ]
