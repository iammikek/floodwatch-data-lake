services:
  lake-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: floodwatch-lake-worker
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./:/app
    command: >
      bash -lc "echo 'lake worker ready (attach and run ingestion scripts)'; sleep infinity"
  lake-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: floodwatch-lake-api
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./:/app
    ports:
      - "${LAKE_API_HOST_PORT:-8000}:8000"
    command: >
      bash -lc "exec bash scripts/start-api.sh"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
